<h2>Goal</h2>
  <p> A hand-controlled game inspired by Wii Fit's Balance Bubble game. </p>

<h2>Features</h2>
  <p>Our game includes a background of a stream. The player tries to navigate to the finish line 
  while avoiding obstacles (rocks) and walls (land). Our game is unique as it utilizes 
  OpenCV and MediaPipe to get user input.
